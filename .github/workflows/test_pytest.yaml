name: Tests

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
  push:
    branches: [ "enh/update-github-actions-for-building-rasterio" ]

defaults:
  run:
    shell: bash

jobs:
  Pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@main
      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-tests.txt
            requirements-optional.txt


      - name: Install GDAL system dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libgdal-dev gdal-bin
            echo "CPLUS_INCLUDE_PATH=/usr/include/gdal" >> $GITHUB_ENV
            echo "C_INCLUDE_PATH=/usr/include/gdal" >> $GITHUB_ENV
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install gdal
          elif [ "$RUNNER_OS" == "Windows" ] && [ "${{ matrix.python-version }}" == "3.14" ]; then
            # Windows + Python 3.14 specific setup
            source "$CONDA/etc/profile.d/conda.sh"
            conda install -c conda-forge gdal -y
            
            cp "$CONDA/Library/lib/gdal.lib" "$CONDA/Library/lib/gdal_i.lib"

            echo "GDAL_HOME=$CONDA/Library" >> $GITHUB_ENV
            echo "GDAL_DATA=$CONDA/Library/share/gdal" >> $GITHUB_ENV
            echo "$CONDA/Library/bin" >> $GITHUB_PATH
            echo "INCLUDE=$CONDA/Library/include;$INCLUDE" >> $GITHUB_ENV
            echo "LIB=$CONDA/Library/lib;$LIB" >> $GITHUB_ENV

            GDAL_VER=$("$CONDA/Library/bin/gdalinfo" --version | awk '{print $2}' | tr -d ',')
            echo "GDAL_VERSION=$GDAL_VER" >> $GITHUB_ENV
          fi

      - name: Install rocketpy
        run: pip install .

      - name: Test importing rocketpy
        run: python -c "import sys, rocketpy; print(f'{rocketpy.__name__} running on Python {sys.version}')"

      - name: Install test dependencies
        run: |
          pip install -r requirements-tests.txt
          pip install .[all]

      - name: Run Unit Tests
        run: pytest tests/unit --cov=rocketpy

      - name: Run Documentation Tests
        run: |
          pip install numpy --upgrade
          pytest rocketpy --doctest-modules --cov=rocketpy --cov-append

      - name: Run Integration Tests
        run: pytest tests/integration --cov=rocketpy --cov-append

      - name: Run Acceptance Tests
        run: pytest tests/acceptance --cov=rocketpy --cov-append --cov-report=xml

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@main
        with:
          name: coverage
          path: coverage.xml
          overwrite: true
          if-no-files-found: error

  CodecovUpload:
    needs: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Download latest coverage report
        uses: actions/download-artifact@main
      - name: Upload to Codecov
        uses: codecov/codecov-action@main
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            coverage.xml
